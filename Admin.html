<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Time Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="text-xl">⚙️</span>
            <h1 class="font-bold text-lg text-slate-800">Admin Dashboard</h1>
        </div>
        <div class="flex items-center space-x-3">
            <a href="/" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold text-slate-700 transition border border-slate-200">🕒 Go to Time Clock</a>
            <button onclick="wipeData()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl text-xs font-semibold transition">⚠️ Wipe Punches Data</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

        <!-- Staff Management Section -->
        <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="text-base font-bold text-slate-900">Staff Directory</h3>
                    <p class="text-xs text-slate-500">Manage employee PINs, pay rates, and weekly schedules.</p>
                </div>
                <button onclick="openStaffModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold text-white transition shadow-sm">Manage Staff</button>
            </div>
        </section>

        <!-- Time Punches Overview Section -->
        <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <h3 class="text-base font-bold text-slate-900">Recorded Time Punches</h3>
                
                <!-- Pay Period Filter -->
                <div class="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                    <span class="text-xs text-slate-600 font-medium pl-2">Pay Period:</span>
                    <select id="pay-period-select" onchange="filterPunches()" class="bg-white border border-slate-300 rounded-lg p-1.5 text-xs text-slate-800">
                        <option value="all">All Records</option>
                    </select>
                </div>
            </div>
            
            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 text-slate-600 uppercase tracking-wider font-mono">
                        <tr>
                            <th class="p-3">Employee</th>
                            <th class="p-3">Location</th>
                            <th class="p-3">Clock In</th>
                            <th class="p-3">Clock Out</th>
                            <th class="p-3">Hours</th>
                            <th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="punches-table-body" class="divide-y divide-slate-200">
                        <!-- Dynamic Punches Loaded Here -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Staff Management Modal -->
    <div id="staff-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-xl overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-sm text-slate-900">Staff Directory</h3>
                <button onclick="closeStaffModal()" class="text-slate-400 hover:text-slate-700 text-base">✕</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6 flex-1">
                
                <!-- Add New Staff Form -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-600">Add New Staff Member</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                        <input type="text" id="new-emp-name" placeholder="Full Name" class="bg-white border border-slate-300 rounded-xl p-2.5 text-xs text-slate-900">
                        <input type="text" id="new-emp-pin" maxlength="4" placeholder="Temp 4-Digit PIN" class="bg-white border border-slate-300 rounded-xl p-2.5 text-xs text-slate-900 font-mono">
                        <input type="number" step="0.01" id="new-emp-rate" placeholder="Pay Rate ($/hr)" value="20.00" class="bg-white border border-slate-300 rounded-xl p-2.5 text-xs text-slate-900 font-mono">
                    </div>
                    <button onclick="addNewEmployee()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold text-xs text-white transition">Add Staff Member</button>
                </div>

                <!-- Existing Staff Table -->
                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 text-slate-600 uppercase tracking-wider font-mono">
                            <tr>
                                <th class="p-3">Name</th>
                                <th class="p-3">PIN</th>
                                <th class="p-3">Pay Rate</th>
                                <th class="p-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staff-table-body" class="divide-y divide-slate-200">
                            <!-- Dynamic Staff Loaded Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Schedule Settings Modal -->
    <div id="schedule-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                <h3 id="schedule-modal-title" class="font-bold text-sm text-slate-900">Edit Schedule</h3>
                <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-slate-700">✕</button>
            </div>
            <input type="hidden" id="sch-emp-id">
            <div id="schedule-days-container" class="space-y-2 max-h-[60vh] overflow-y-auto pr-2">
                <!-- Dynamic Days Loaded Here -->
            </div>
            <button onclick="saveSchedule()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-xs text-white transition">Save Schedule</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let employeesCache = [];
        let allPunchesCache = [];

        async function initAdmin() {
            await fetchEmployees();
            await fetchPunches();
        }

        async function fetchEmployees() {
            const res = await fetch('/api/employees');
            employeesCache = await res.json();
        }

        async function fetchPunches() {
            const res = await fetch('/api/punches');
            allPunchesCache = await res.json();
            populatePayPeriods(allPunchesCache);
            filterPunches();
        }

        function populatePayPeriods(punches) {
            const select = document.getElementById('pay-period-select');
            const periods = new Set();

            function getMonday(d) {
                const date = new Date(d);
                const day = date.getDay();
                const diff = date.getDate() - day + (day === 0 ? -6 : 1);
                return new Date(date.setDate(diff));
            }

            punches.forEach(p => {
                if (!p.clockIn) return;
                const punchDate = new Date(p.clockIn);
                let monday = getMonday(punchDate);
                
                const anchor = new Date('2026-10-12');
                const diffTime = monday - anchor;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const weekNumber = Math.floor(diffDays / 7);
                
                if (weekNumber % 2 !== 0) {
                    monday.setDate(monday.getDate() - 7);
                }

                periods.add(monday.toISOString().split('T')[0]);
            });

            let html = '<option value="all">All Records</option>';
            Array.from(periods).sort().reverse().forEach(dateStr => {
                const start = new Date(dateStr + 'T00:00:00');
                const end = new Date(start);
                end.setDate(start.getDate() + 13);
                
                const label = `${start.toLocaleDateString()} - ${end.toLocaleDateString()}`;
                html += `<option value="${dateStr}">${label}</option>`;
            });
            select.innerHTML = html;
        }

        function filterPunches() {
            const filterVal = document.getElementById('pay-period-select').value;
            let filtered = allPunchesCache;

            if (filterVal !== 'all') {
                const startDate = new Date(filterVal + 'T00:00:00');
                const endDate = new Date(startDate);
                endDate.setDate(startDate.getDate() + 14);

                filtered = allPunchesCache.filter(p => {
                    if (!p.clockIn) return false;
                    const punchDate = new Date(p.clockIn);
                    return punchDate >= startDate && punchDate < endDate;
                });
            }

            document.getElementById('punches-table-body').innerHTML = filtered.map(p => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 font-medium text-slate-900">${p.name}</td>
                    <td class="p-3 text-slate-600">${p.qbClass || 'N/A'}</td>
                    <td class="p-3 text-slate-600 font-mono">${p.clockIn ? new Date(p.clockIn).toLocaleString() : '-'}</td>
                    <td class="p-3 text-slate-600 font-mono">${p.clockOut ? new Date(p.clockOut).toLocaleString() : '<span class="text-emerald-600 font-bold animate-pulse">Active</span>'}</td>
                    <td class="p-3 text-indigo-600 font-mono font-bold">${p.hoursDecimal ? p.hoursDecimal + ' hrs' : '-'}</td>
                    <td class="p-3 text-right">
                        <button onclick="deletePunch(${p.id})" class="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded text-[10px] font-semibold transition border border-rose-200">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function openStaffModal() {
            await fetchEmployees();
            document.getElementById('staff-table-body').innerHTML = employeesCache.map(emp => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 font-medium text-slate-900">${emp.name}</td>
                    <td class="p-3 text-slate-600 font-mono">${emp.pin}</td>
                    <td class="p-3">
                        <div class="flex items-center space-x-1">
                            <span class="text-slate-400">$</span>
                            <input type="number" step="0.01" id="rate-${emp.id}" value="${emp.payRate || 20.00}" onchange="updatePayRate(${emp.id})" class="w-20 bg-slate-50 border border-slate-300 rounded p-1 text-slate-900 font-mono text-center">
                            <span class="text-slate-400 text-[10px]">/hr</span>
                        </div>
                    </td>
                    <td class="p-3 text-right space-x-1">
                        <button onclick="openScheduleModal(${emp.id})" class="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded text-[10px] font-semibold transition border border-indigo-200">Schedule</button>
                        <button onclick="resetPin(${emp.id})" class="px-2 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded text-[10px] font-semibold transition border border-amber-200">Reset PIN</button>
                        <button onclick="deleteEmployee(${emp.id})" class="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded text-[10px] font-semibold transition border border-rose-200">Delete</button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('staff-modal').classList.remove('hidden');
            document.getElementById('staff-modal').classList.add('flex');
        }

        function closeStaffModal() {
            document.getElementById('staff-modal').classList.remove('flex');
            document.getElementById('staff-modal').classList.add('hidden');
        }

        async function addNewEmployee() {
            const name = document.getElementById('new-emp-name').value.trim();
            const pin = document.getElementById('new-emp-pin').value.trim();
            const payRate = parseFloat(document.getElementById('new-emp-rate').value) || 20.00;

            if (!name || pin.length !== 4) { alert("Please enter a valid name and a 4-digit PIN."); return; }
            
            const res = await fetch('/api/employees/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, pin, payRate })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('new-emp-name').value = "";
                document.getElementById('new-emp-pin').value = "";
                openStaffModal();
            } else {
                alert(data.error || "Error adding employee.");
            }
        }

        async function updatePayRate(id) {
            const payRate = parseFloat(document.getElementById(`rate-${id}`).value) || 20.00;
            await fetch('/api/employees/rate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, payRate })
            });
        }

        async function resetPin(id) {
            const newPin = prompt("Enter a new 4-digit PIN for this employee:");
            if (!newPin || newPin.length !== 4) return;
            const res = await fetch('/api/employees/reset-pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, newPin })
            });
            if ((await res.json()).success) alert("PIN reset successfully!");
        }

        async function deleteEmployee(id) {
            if (!confirm("Are you sure you want to delete this employee?")) return;
            await fetch('/api/employees/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            openStaffModal();
        }

        function openScheduleModal(id) {
            const emp = employeesCache.find(e => e.id === id);
            if (!emp) return;
            document.getElementById('sch-emp-id').value = emp.id;
            document.getElementById('schedule-modal-title').innerText = `Edit Schedule: ${emp.name}`;
            
            const days = [
                { key: 'mon', label: 'Monday' },
                { key: 'tue', label: 'Tuesday' },
                { key: 'wed', label: 'Wednesday' },
                { key: 'thu', label: 'Thursday' },
                { key: 'fri', label: 'Friday' },
                { key: 'sat', label: 'Saturday' },
                { key: 'sun', label: 'Sunday' }
            ];

            document.getElementById('schedule-days-container').innerHTML = days.map(d => `
                <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <span class="text-xs font-semibold text-slate-700 w-24">${d.label}</span>
                    <div class="flex items-center space-x-2">
                        <input type="time" id="${d.key}-start" value="${emp[d.key + 'Start'] || '08:00'}" class="bg-white border border-slate-300 rounded p-1 text-xs text-slate-900 font-mono">
                        <span class="text-slate-400">to</span>
                        <input type="time" id="${d.key}-end" value="${emp[d.key + 'End'] || '17:00'}" class="bg-white border border-slate-300 rounded p-1 text-xs text-slate-900 font-mono">
                    </div>
                </div>
            `).join('');

            document.getElementById('schedule-modal').classList.remove('hidden');
            document.getElementById('schedule-modal').classList.add('flex');
        }

        function closeScheduleModal() {
            document.getElementById('schedule-modal').classList.remove('flex');
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        async function saveSchedule() {
            const id = document.getElementById('sch-emp-id').value;
            const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
            const payload = { id };
            days.forEach(d => {
                payload[d + 'Start'] = document.getElementById(`${d}-start`).value;
                payload[d + 'End'] = document.getElementById(`${d}-end`).value;
            });

            const res = await fetch('/api/employees/schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if ((await res.json()).success) {
                closeScheduleModal();
                fetchEmployees();
                alert("Schedule updated successfully!");
            }
        }

        async function deletePunch(id) {
            if (!confirm("Are you sure you want to delete this punch record?")) return;
            await fetch('/api/punches/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchPunches();
        }

        async function wipeData() {
            if (!confirm("⚠️ WARNING: This will delete ALL recorded time punches. Are you sure?")) return;
            const res = await fetch('/api/punches/wipe', { method: 'POST' });
            if ((await res.json()).success) {
                fetchPunches();
                alert("All punches wiped successfully.");
            }
        }

        initAdmin();
    </script>
</body>
</html>

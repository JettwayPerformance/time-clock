<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
</head>
<body style="font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <form action="/login" method="POST" style="background: #f4f4f4; padding: 20px; border-radius: 8px;">
        <h3>Admin Login</h3>
        <label>Password:</label><br>
        <input type="password" name="password" required style="margin: 10px 0; padding: 5px;"><br>
        <button type="submit" style="padding: 5px 10px;">Login</button>
    </form>
</body>
</html>

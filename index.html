<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Clock Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-white border-b border-slate-200 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="text-xl">🕒</span>
            <h1 class="font-bold text-lg text-slate-800">Time Clock Terminal</h1>
        </div>
        <a href="/admin.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold text-slate-700 transition border border-slate-200">⚙️ Admin Dashboard</a>
    </header>

    <!-- Main Terminal Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

        <!-- PIN Terminal Section (2 Columns) -->
        <section class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-6">
            <div class="text-center space-y-3">
                <!-- Location Selector Above PIN -->
                <div class="max-w-xs mx-auto space-y-1">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Select Location / Class</label>
                    <select id="location-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Bryant">📍 Bryant</option>
                        <option value="Cabot">📍 Cabot</option>
                        <option value="Maumelle">📍 Maumelle</option>
                    </select>
                </div>

                <div>
                    <h2 id="terminal-title" class="text-xl font-bold text-slate-900 mt-2">Enter Your 4-Digit PIN</h2>
                    <p id="terminal-subtitle" class="text-xs text-slate-500">Type on your keyboard or use the keypad below.</p>
                </div>
            </div>

            <!-- PIN Display Screen -->
            <div class="max-w-xs mx-auto">
                <input type="password" id="pin-display" readonly maxlength="4" placeholder="----" class="w-full bg-slate-50 border border-slate-300 rounded-2xl p-4 text-center text-3xl font-mono text-slate-900 tracking-widest focus:outline-none">
            </div>

            <!-- Number Pad -->
            <div class="max-w-xs mx-auto grid grid-cols-3 gap-3">
                <button onclick="pressKey('1')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">1</button>
                <button onclick="pressKey('2')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">2</button>
                <button onclick="pressKey('3')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">3</button>
                <button onclick="pressKey('4')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">4</button>
                <button onclick="pressKey('5')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">5</button>
                <button onclick="pressKey('6')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">6</button>
                <button onclick="pressKey('7')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">7</button>
                <button onclick="pressKey('8')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">8</button>
                <button onclick="pressKey('9')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">9</button>
                <button onclick="clearPin()" class="p-4 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl font-semibold text-sm transition border border-rose-200">Clear</button>
                <button onclick="pressKey('0')" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-lg text-slate-800 transition">0</button>
                <button onclick="submitPin()" class="p-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold text-sm text-white transition shadow-sm">Enter</button>
            </div>
        </section>

        <!-- Live Team Status Sidebar -->
        <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
            <h3 class="text-base font-bold text-slate-900 flex items-center space-x-2"><span>🟢</span><span>Live Team Status</span></h3>
            <div id="team-status-list" class="space-y-3 max-h-[500vh] overflow-y-auto pr-1">
                <!-- Dynamic Status Loaded Here -->
            </div>
        </section>

    </main>

    <!-- First-Time PIN Setup Modal -->
    <div id="setup-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4 text-center">
            <h3 id="setup-modal-title" class="text-base font-bold text-slate-900">Set Your Personal PIN</h3>
            <p class="text-xs text-slate-500">This is your first time logging in. Please choose a secure 4-digit PIN:</p>
            <input type="password" id="new-pin-input" maxlength="4" placeholder="----" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-center text-2xl font-mono text-slate-900 tracking-widest focus:outline-none">
            <button onclick="saveNewPin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-xs text-white transition">Save & Continue</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentPin = "";
        let users = [];
        let setupEmployeeId = null;

        async function initTerminal() {
            const res = await fetch('/api/employees');
            users = await res.json();
            renderTeamStatus();
        }

        // Global Keyboard Listener
        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'SELECT') return;

            // If setup modal is open, let Enter trigger saveNewPin
            if (document.getElementById('setup-modal').classList.contains('flex')) {
                if (e.key === 'Enter') {
                    saveNewPin();
                }
                return;
            }

            // Normal PIN entry keypad handler
            if (e.key >= '0' && e.key <= '9') {
                pressKey(e.key);
            } else if (e.key === 'Backspace') {
                if (currentPin.length > 0) {
                    currentPin = currentPin.slice(0, -1);
                    document.getElementById('pin-display').value = currentPin;
                }
            } else if (e.key === 'Enter') {
                if (currentPin.length === 4) {
                    submitPin();
                }
            }
        });

        function pressKey(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                document.getElementById('pin-display').value = currentPin;
                if (currentPin.length === 4) {
                    submitPin();
                }
            }
        }

        function clearPin() {
            currentPin = "";
            document.getElementById('pin-display').value = "";
        }

        async function submitPin() {
            const pin = currentPin;
            clearPin();

            const emp = users.find(u => u.pin === pin);
            if (!emp) {
                alert("Invalid PIN. Please try again.");
                return;
            }

            // Check if first-time PIN setup is required
            if (emp.needsPinSetup === 1) {
                setupEmployeeId = emp.id;
                document.getElementById('setup-modal').classList.remove('hidden');
                document.getElementById('setup-modal').classList.add('flex');
                document.getElementById('new-pin-input').value = "";
                document.getElementById('new-pin-input').focus();
                return;
            }

            const selectedLocation = document.getElementById('location-select').value;
            
            // Fetch latest punches
            const res = await fetch('/api/punches');
            const punches = await res.json();
            const activePunch = punches.find(p => p.name === emp.name && !p.clockOut);

            if (activePunch) {
                if (confirm(`Welcome, ${emp.name}!\nWould you like to clock out?`)) {
                    await completeClockOut(activePunch, emp.name);
                }
            } else {
                await executeClockIn(emp, selectedLocation);
            }
        }

        async function saveNewPin() {
            const newPin = document.getElementById('new-pin-input').value.trim();
            if (newPin.length !== 4 || isNaN(newPin)) {
                alert("Please enter a valid 4-digit PIN.");
                return;
            }

            const res = await fetch('/api/employees/update-pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: setupEmployeeId, pin: newPin })
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('setup-modal').classList.remove('flex');
                document.getElementById('setup-modal').classList.add('hidden');
                alert("PIN successfully set! You are now ready to clock in/out.");
                await initTerminal();
            } else {
                alert(data.error || "PIN already in use. Please choose another.");
            }
        }

        async function executeClockIn(emp, qbClass) {
            const now = new Date().toISOString();
            const payload = {
                id: Date.now(),
                name: emp.name,
                qbClass: qbClass,
                clockIn: now,
                clockOut: null,
                hoursDecimal: 0,
                override: 0,
                manager: null
            };

            const res = await fetch('/api/punches/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                alert(`${emp.name} successfully clocked in at ${qbClass}!`);
                renderTeamStatus();
            } else {
                alert("Error recording clock-in. Please try again.");
            }
        }

        async function completeClockOut(activePunch, empName) {
            const clockOutTime = new Date();
            const clockInTime = new Date(activePunch.clockIn);
            const diffMs = clockOutTime - clockInTime;
            const hoursDecimal = parseFloat((diffMs / (1000 * 60 * 60)).toFixed(2));

            const payload = {
                id: activePunch.id,
                name: activePunch.name,
                qbClass: activePunch.qbClass,
                clockIn: activePunch.clockIn,
                clockOut: clockOutTime.toISOString(),
                hoursDecimal: hoursDecimal
            };

            const res = await fetch('/api/punches/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                alert(`${empName} successfully clocked out. Total hours: ${hoursDecimal}`);
                renderTeamStatus();
            } else {
                alert("Error recording clock-out. Please try again.");
            }
        }

        async function renderTeamStatus() {
            const res = await fetch('/api/punches');
            const timeLog = await res.json();
            
            const activeStaff = users.filter(u => u.name && u.showOnClock === 1).sort((a, b) => a.name.localeCompare(b.name));
            
            document.getElementById('team-status-list').innerHTML = activeStaff.map(emp => {
                const active = timeLog.find(e => e.name === emp.name && !e.clockOut);
                return active ? `
                    <div class="flex items-center justify-between p-3 bg-emerald-50 border border-emerald-200 rounded-xl">
                        <div>
                            <div class="font-bold text-slate-900 text-xs flex items-center space-x-1.5">
                                <span>🎵</span><span>${emp.name}</span>
                            </div>
                            <div class="text-[11px] text-emerald-700 font-medium">📍 ${active.qbClass}</div>
                        </div>
                        <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 border border-emerald-300 font-bold rounded-full text-[10px]">Clocked In</span>
                    </div>` : `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl">
                        <div>
                            <div class="font-bold text-slate-700 text-xs flex items-center space-x-1.5">
                                <span>🎵</span><span>${emp.name}</span>
                            </div>
                            <div class="text-[11px] text-slate-400">Offline</div>
                        </div>
                        <span class="px-2.5 py-1 bg-slate-200 text-slate-600 font-semibold rounded-full text-[10px]">Offline</span>
                    </div>`;
            }).join('');
        }

        initTerminal();
    </script>
</body>
</html>

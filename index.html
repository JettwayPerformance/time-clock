<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Clock Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-xl">🕒</span>
            <h1 class="font-bold text-lg text-white">Time Clock Terminal</h1>
        </div>
        <a href="/admin.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-200 transition">⚙️ Admin Dashboard</a>
    </header>

    <!-- Main Terminal Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

        <!-- PIN Terminal Section (2 Columns) -->
        <section class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="text-center space-y-1">
                <h2 id="terminal-title" class="text-xl font-bold text-white">Enter Your 4-Digit PIN</h2>
                <p id="terminal-subtitle" class="text-xs text-slate-400">Type your PIN below to clock in or out.</p>
            </div>

            <!-- PIN Display Screen -->
            <div class="max-w-xs mx-auto">
                <input type="password" id="pin-display" readonly maxlength="4" placeholder="----" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-center text-3xl font-mono text-white tracking-widest focus:outline-none">
            </div>

            <!-- Number Pad -->
            <div class="max-w-xs mx-auto grid grid-cols-3 gap-3">
                <button onclick="pressKey('1')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">1</button>
                <button onclick="pressKey('2')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">2</button>
                <button onclick="pressKey('3')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">3</button>
                <button onclick="pressKey('4')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">4</button>
                <button onclick="pressKey('5')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">5</button>
                <button onclick="pressKey('6')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">6</button>
                <button onclick="pressKey('7')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">7</button>
                <button onclick="pressKey('8')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">8</button>
                <button onclick="pressKey('9')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">9</button>
                <button onclick="clearPin()" class="p-4 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 rounded-xl font-semibold text-sm transition">Clear</button>
                <button onclick="pressKey('0')" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-lg text-white transition">0</button>
                <button onclick="submitPin()" class="p-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold text-sm text-white transition">Enter</button>
            </div>
        </section>

        <!-- Live Team Status Sidebar (1 Column) -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <h3 class="text-base font-bold text-white flex items-center space-x-2"><span>🟢</span><span>Live Team Status</span></h3>
            <div id="team-status-list" class="space-y-3 max-h-[500vh] overflow-y-auto pr-1">
                <!-- Dynamic Status Loaded Here -->
            </div>
        </section>

    </main>

    <!-- Location & Action Modal (Popups when PIN is entered) -->
    <div id="action-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 id="modal-employee-name" class="text-base font-bold text-white text-center">Welcome</h3>
            <p id="modal-action-text" class="text-xs text-slate-400 text-center">Select your QuickBooks Location/Class:</p>
            
            <div class="space-y-2">
                <button onclick="executeClockAction('Bryant')" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-semibold text-xs text-white transition">📍 Bryant</button>
                <button onclick="executeClockAction('Cabot')" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-semibold text-xs text-white transition">📍 Cabot</button>
                <button onclick="executeClockAction('Maumelle')" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-semibold text-xs text-white transition">📍 Maumelle</button>
            </div>

            <button onclick="closeActionModal()" class="w-full py-2 bg-slate-800/50 hover:bg-slate-800 rounded-xl font-semibold text-xs text-slate-400 transition">Cancel</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentPin = "";
        let users = [];
        let activeEmployee = null;

        async function initTerminal() {
            const res = await fetch('/api/employees');
            users = await res.json();
            renderTeamStatus();
        }

        function pressKey(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                document.getElementById('pin-display').value = currentPin;
                if (currentPin.length === 4) {
                    submitPin();
                }
            }
        }

        function clearPin() {
            currentPin = "";
            document.getElementById('pin-display').value = "";
        }

        async function submitPin() {
            const pin = currentPin;
            clearPin();

            const emp = users.find(u => u.pin === pin);
            if (!emp) {
                alert("Invalid PIN. Please try again.");
                return;
            }

            activeEmployee = emp;
            
            // Fetch latest punch status
            const res = await fetch('/api/punches');
            const punches = await res.json();
            const activePunch = punches.find(p => p.name === emp.name && !p.clockOut);

            if (activePunch) {
                // Already clocked in -> Clock out directly
                if (confirm(`${emp.name}, would you like to clock out?`)) {
                    await completeClockOut(activePunch);
                }
            } else {
                // Not clocked in -> Show location modal
                document.getElementById('modal-employee-name').innerText = `Hello, ${emp.name}`;
                document.getElementById('action-modal').classList.remove('hidden');
                document.getElementById('action-modal').classList.add('flex');
            }
        }

        async function executeClockAction(qbClass) {
            closeActionModal();
            const now = new Date().toISOString();
            
            const payload = {
                id: Date.now(),
                name: activeEmployee.name,
                qbClass: qbClass,
                clockIn: now,
                clockOut: null,
                hoursDecimal: 0,
                override: 0,
                manager: null
            };

            await fetch('/api/punches/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert(`${activeEmployee.name} successfully clocked in at ${qbClass}!`);
            renderTeamStatus();
        }

        async function completeClockOut(activePunch) {
            const clockOutTime = new Date();
            const clockInTime = new Date(activePunch.clockIn);
            const diffMs = clockOutTime - clockInTime;
            const hoursDecimal = parseFloat((diffMs / (1000 * 60 * 60)).toFixed(2));

            const payload = {
                id: activePunch.id,
                name: activePunch.name,
                qbClass: activePunch.qbClass,
                clockIn: activePunch.clockIn,
                clockOut: clockOutTime.toISOString(),
                hoursDecimal: hoursDecimal
            };

            await fetch('/api/punches/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert(`${activePunch.name} successfully clocked out. Total hours: ${hoursDecimal}`);
            renderTeamStatus();
        }

        function closeActionModal() {
            document.getElementById('action-modal').classList.remove('flex');
            document.getElementById('action-modal').classList.add('hidden');
        }

        async function renderTeamStatus() {
            const res = await fetch('/api/punches');
            const timeLog = await res.json();
            const activeStaff = users.filter(u => u.name).sort((a, b) => a.name.localeCompare(b.name));
            
            document.getElementById('team-status-list').innerHTML = activeStaff.map(emp => {
                const active = timeLog.find(e => e.name === emp.name && !e.clockOut);
                return active ? `
                    <div class="flex items-center justify-between p-3 bg-emerald-950/30 border border-emerald-500/30 rounded-xl">
                        <div>
                            <div class="font-bold text-white text-xs">${emp.name}</div>
                            <div class="text-[11px] text-emerald-400">📍 ${active.qbClass}</div>
                        </div>
                        <span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold rounded-full text-[10px] animate-pulse">Clocked In</span>
                    </div>` : `
                    <div class="flex items-center justify-between p-3 bg-slate-950/40 border border-slate-800 rounded-xl">
                        <div>
                            <div class="font-bold text-slate-300 text-xs">${emp.name}</div>
                            <div class="text-[11px] text-slate-500">Offline</div>
                        </div>
                        <span class="px-2.5 py-1 bg-slate-800 text-slate-400 font-semibold rounded-full text-[10px]">Offline</span>
                    </div>`;
            }).join('');
        }

        initTerminal();
    </script>
</body>
</html>
